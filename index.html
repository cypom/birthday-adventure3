<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=26"><style>
#cake{left:322px;top:262px;width:76px;height:76px;background:radial-gradient(circle at 50% 38%,#d8ab91 0,#c8987c 55%,#b3806a 100%);border:4px solid #f4f1ec;border-radius:50%;box-shadow:0 3px 0 #bdb7ae}
#cake .peach{left:22px;top:28px;width:8px;height:6px;background:#ffcf5a;box-shadow:8px 2px 0 #ffb62e,16px 0 0 #ffcf5a,4px 6px 0 #ffb62e,12px 6px 0 #ffcf5a,20px 6px 0 #ffb62e}
#cake .ch{width:14px;height:14px;border-radius:50%}
#cake .c1{left:11px;top:11px}
#cake .c2{left:43px;top:11px}
#cake .c3{left:43px;top:43px}
#cake .c4{left:11px;top:43px}
#cake .dr{bottom:auto;width:12px;height:12px;border-radius:50%;background:#d9ae95}
#cake .d1{left:-4px;top:28px}
#cake .d2{left:28px;top:-4px}
#cake .d3{left:60px;top:28px}
#cake .d4{left:28px;top:60px}
#cake .cn{top:10px;width:4px;height:18px}
#cake i.cn:nth-of-type(1){left:28px}
#cake i.cn:nth-of-type(2){left:34px}
#cake i.cn:nth-of-type(3){left:40px}
</style></head>
<body data-state="identity-check">
<section id="boot"><div class="box">
<h1>SYSTEM CHECK</h1><p>身分確認中，正在檢測……</p>
<p id="bar">[░░░░░░░░░░] 0%</p><pre id="log"></pre>
<h2 id="ok" hidden>PLAYER VERIFIED.<br>WELCOME.</h2>
<div id="pw" hidden><p>ENTER PASSCODE</p>
<input id="pwIn" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="----">
<button id="pwBtn" type="button" class="btn">▶ OK</button><p id="pwMsg"></p></div>
</div></section>

<div id="hud"><div id="quest"></div><div id="mem"></div><button id="restart" type="button" class="btn">↻</button></div>

<div id="wrap"><div id="stage">
<div id="window" class="obj" data-id="window"><div class="sky"></div><div id="curL" class="cur"></div><div id="curR" class="cur"></div></div>
<div id="beam"></div>
<div id="clock" class="obj" data-id="clock"><i id="hh"></i><i id="mm"></i><i id="ss"></i></div>
<div id="frame" class="obj" data-id="frame"><b></b></div>
<div id="wardrobe" class="obj" data-id="wardrobe"><span id="shirt"></span><u class="dl"></u><u class="dr"></u></div>
<div id="rug" class="obj" data-id="rug"></div>
<div id="bed" class="obj" data-id="bed"><span class="pillow"></span><span id="blanket"></span></div>
<div id="desk"></div>
<div id="drawer" class="obj" data-id="drawer"></div>
<div id="diary" class="obj lockd" data-id="diary"></div>
<div id="speaker" class="obj" data-id="speaker"><i class="led"></i></div>
<div id="plush" class="obj" data-id="plush"><i class="ear"></i><i class="ear r"></i></div>
<div id="cake" class="obj" data-id="cake" hidden><span class="peach"></span><span class="ch c1"></span><span class="ch c2"></span><span class="ch c3"></span><span class="ch c4"></span><span class="dr d1"></span><span class="dr d2"></span><span class="dr d3"></span><span class="dr d4"></span><i class="cn"><b></b></i><i class="cn"><b></b></i><i class="cn"><b></b></i></div>
<div id="dark"></div>
<button id="openBtn" type="button" class="btn" hidden>[CLICK TO OPEN]</button>
</div></div>

<div id="hint"></div><div id="toast"></div>
<div id="dlg" hidden><div class="box"><h2 id="dt"></h2><div id="db"></div><div id="dbtn"></div></div></div>
<script src="cat.js?v=26"></script>
<script src="script.js?v=26"></script>
<script src="wish.js?v=26"></script>
</body></html>
